[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta:__legacy__"

[project]
name = "ayrannotes"
version = "0.0.1"
description = "A lightweight, customizable Linux desktop note-taking application"
authors = [{name = "Berat Besli"}]
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
keywords = ["notes", "markdown", "desktop", "linux"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business",
]
dependencies = [
    "PyQt6>=6.5.0",
    "markdown>=3.4.0",
    "Pygments>=2.15.0",
    "PyYAML>=6.0",
]

[project.scripts]
ayrannotes = "ayrannotes.main:main"

[tool.setuptools.packages.find]
where = ["."]

[tool.setuptools.package-data]
ayrannotes = ["assets/*.png", "localization/*.json"]
